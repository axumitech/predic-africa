name: Deploy Predic Africa

on:
  push:
    branches:
      - main

concurrency:
  group: predicafrica-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/predicafrica_actions
          chmod 600 ~/.ssh/predicafrica_actions
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/predicafrica_actions \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE_SCRIPT'
              set -Eeuo pipefail

              cd /var/www/predicafrica

              php artisan down --retry=60 || true

              restore_application() {
                php artisan up || true
              }

              trap restore_application EXIT

              git fetch origin main
              git checkout main
              git pull --ff-only origin main

              composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction

              npm ci
              npm run build

              php artisan migrate --force
              php artisan storage:link || true
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan queue:restart || true

              php artisan up
              trap - EXIT
          REMOTE_SCRIPT
